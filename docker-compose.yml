version: "3.9"

services:
  # ─────────────────────────────────────────────────────────────
  # PostgreSQL 16 with pgvector extension
  # ─────────────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: aiuthor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiuthor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiuthor_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aiuthor_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiuthor} -d ${POSTGRES_DB:-aiuthor_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiuthor_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
